<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Fantasyvärlden</title>
<meta name="description" content="Ett äventyrsspel i Rollspelsklubbens värld, med Drakar och Demoner-regler.">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16120e">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fantasyvärlden">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@800&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
:root{
  /* --pix = rubriker, knappar och siffror (Nunito Extra Bold) */
  --bg:#16120e; --bg2:#1d1813; --panel:#241d16; --panel2:#2d241b; --line:#4a3c2c;
  --fg:#efe4cf; --muted:#b3a58c; --gold:#e0b450; --gold-dk:#9c7a2c; --red:#c9473b; --moss:#86ad5c; --sky:#6fa8d6; --vp:#8a7ad8;
  --pix:"Nunito", system-ui, "Segoe UI", sans-serif; --body:"Alegreya Sans", system-ui, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--body);font-size:17px;line-height:1.45;
  padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 100px max(14px,env(safe-area-inset-left));
  background-image:linear-gradient(#0000 0 0),radial-gradient(circle at 50% -20%,#3a2a1844,#0000 60%);}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--pix);font-weight:800;margin:0;letter-spacing:.02em;text-wrap:balance}
h1{font-size:clamp(1.15rem,5.6vw,1.7rem);color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} h2{font-size:1.25rem;color:var(--gold)} h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.88rem}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{font-family:var(--pix);font-weight:800;font-size:1rem;border:0;border-radius:4px;padding:11px 16px;background:var(--gold);color:#2a1c05;box-shadow:0 4px 0 var(--gold-dk);transition:transform .07s;text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--gold-dk)}
.btn.ghost{background:var(--panel2);color:var(--fg);box-shadow:0 4px 0 #0d0a07}
.btn.red{background:var(--red);color:#fff;box-shadow:0 4px 0 #7a2219}
.btn.small{padding:7px 11px;font-size:.88rem}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn .sub{display:block;font-family:var(--body);font-weight:500;font-size:.8rem;opacity:.85}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.top{display:flex;align-items:center;gap:12px}
.top .logo{width:46px;height:46px;border-radius:50%;flex:none}
.top .t{flex:1;min-width:0}
.iconbtn{background:var(--panel2);border:1px solid var(--line);border-radius:50%;width:42px;height:42px;display:grid;place-items:center;font-size:1.2rem;flex:none}
.sync{font-size:.8rem;color:var(--muted)}
.sync.ok{color:var(--moss)} .sync.fel{color:var(--red)}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.portr{width:56px;height:56px;border-radius:4px;border:2px solid var(--line);background:#2b2219}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.achips{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.achip{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 6px;color:var(--fg);font:inherit;font-size:.8rem;text-align:left;cursor:pointer}
.achip canvas{width:32px;height:32px;flex:none;border-radius:3px}
.achip.pa{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.achip.mot.pa{border-color:#d0554a;box-shadow:inset 0 0 0 1px #d0554a}
.achip:disabled{opacity:.4;cursor:default}
.astart{flex-wrap:nowrap;align-items:center;position:sticky;bottom:0;z-index:5;background:var(--bg);padding:8px 0;border-top:1px solid var(--line)}
.alista{display:flex;flex-direction:column;gap:4px}
.arad{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg2)}
.arad.pa{border-color:#d0554a}
.aknapp{display:flex;align-items:center;gap:6px;flex:none}.aknapp b{min-width:1.2em;text-align:center}
.aknapp .btn{min-width:34px;padding:2px 8px}
.hcard{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;gap:10px;align-items:center;text-align:left;width:100%}
.hcard,.slot.fylld{position:relative;cursor:pointer;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:transform .45s ease}
.hcard.trycker,.slot.trycker{transform:scale(.94)}
.hcard canvas,.slot canvas{-webkit-user-drag:none;pointer-events:none}
.hval{width:32px;height:32px;border-radius:50%;border:2px solid var(--gold);background:var(--bg2);color:var(--gold);font:800 1.15rem/1 inherit;display:grid;place-items:center;padding:0;cursor:pointer;box-shadow:0 1px 3px #0008}
.hval.ut{position:absolute;top:3px;right:3px;width:24px;height:24px;font-size:.8rem;border-color:#d0554a;color:#fff;background:#b0362bdd}
.skaka{animation:skaka .3s}
@keyframes skaka{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.slumpval{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.slumpval .btn{font-size:1.4rem;padding:12px 0}
.slots .slot{touch-action:none;-webkit-user-select:none;user-select:none}
.slot.lyft{outline:3px dashed var(--gold);outline-offset:-3px;opacity:.45}
.slot.mal{border-color:var(--gold);border-style:solid;box-shadow:0 0 0 3px var(--gold);background:var(--panel2)}
.flyttspoke{position:fixed;z-index:60;pointer-events:none;opacity:.9;border-radius:6px;border:2px solid var(--gold);box-shadow:0 6px 16px #000a;transform:scale(1.08)}
.notis{position:fixed;left:50%;bottom:20px;transform:translate(-50%,20px);background:var(--panel2);border:1px solid var(--gold);color:var(--fg);padding:10px 14px;border-radius:8px;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:90vw;text-align:center}
.notis.syns{opacity:1;transform:translate(-50%,0)}
.hcard.vald{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.hcard.dod{opacity:.55}
.hcard>span{min-width:0;overflow-wrap:break-word}
.hcard .namn{font-weight:800;line-height:1.15;font-size:.95rem}
.hcard .portr{width:46px;height:46px;flex:none}
.hcard{gap:8px;padding:8px}
.hcard .info{font-size:.82rem;color:var(--muted)}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.slot{aspect-ratio:1;border:2px dashed var(--line);border-radius:6px;display:grid;place-items:center;color:var(--muted);font-size:.8rem;text-align:center;padding:4px;background:var(--bg2)}
.slot canvas{width:100%;height:100%;border-radius:4px}
.slot.fylld{border-style:solid;padding:0;position:relative;overflow:hidden}
.slot .lbl{position:absolute;bottom:0;left:0;right:0;background:#000a;font-size:.72rem;padding:2px 4px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kassa{font-family:var(--pix);font-weight:800;color:var(--gold);font-size:1.15rem}
.tag{display:inline-block;font-size:.75rem;padding:2px 7px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--muted)}
.tag.gold{color:var(--gold);border-color:var(--gold-dk)}
.tag.red{color:#ff9d92;border-color:var(--red)}
/* TV:n */
.tv{background:#000;border:3px solid #3a2e22;border-radius:6px;overflow:hidden;position:relative;box-shadow:0 6px 0 #0d0a07}
.tv canvas{width:100%;aspect-ratio:16/9}
.tv canvas.vader,.tv canvas.sno,.tv canvas.eld{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
/* Under äventyr sitter TV:n kvar högst upp när man scrollar. På liggande mobil hålls den lagom hög. */
.tv.fast{position:sticky;top:max(6px,env(safe-area-inset-top));z-index:10;width:100%;max-width:calc(42vh*16/9);margin-inline:auto;box-sizing:border-box;box-shadow:0 6px 0 #0d0a07,0 -16px 0 4px var(--bg)}
.tv .badge{position:absolute;left:8px;top:8px;background:#000b;color:var(--gold);font-family:var(--pix);font-weight:800;font-size:.8rem;padding:3px 8px;border-radius:3px}
.prog{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.prog i{width:14px;height:14px;border-radius:2px;background:var(--panel2);border:1px solid var(--line);display:block}
.prog i.klar{background:var(--moss);border-color:var(--moss)} .prog i.nu{background:var(--gold);border-color:var(--gold)} .prog i.boss{border-radius:50%}
/* Sällskapets status */
.party{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.pm{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px;display:flex;gap:8px;align-items:center;min-width:0}
.pm.aktiv{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.pm.nere{opacity:.6}
.pm canvas{width:40px;height:40px;border-radius:3px;flex:none}
.pm .n{font-weight:800;font-size:.9rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:7px;background:#0007;border-radius:2px;overflow:hidden;margin-top:3px}
.bar>b{display:block;height:100%;background:var(--red)}
.bar.vp>b{background:var(--vp)}
.bar.f>b{background:#d06a3a}
.siffra{font-size:.72rem;color:var(--muted)}
/* Fiender */
.fiender{display:flex;flex-direction:column;gap:6px}
.fiende{display:flex;gap:10px;align-items:center;background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:6px 10px}
.fiende .n{flex:1;font-weight:700}
.fiende .bar{width:110px}
.fiende.dod{opacity:.4;text-decoration:line-through}
.logg{background:#0d0b08;border:1px solid var(--line);border-radius:5px;padding:10px;max-height:220px;overflow:auto;font-size:.92rem;display:flex;flex-direction:column;gap:3px}
.logg .d{color:var(--gold)} .logg .dm{color:#ff8a7e} .logg .ok{color:var(--moss)} .logg .fel{color:#ff9d92} .logg .info{color:var(--muted)}
.berattelse{font-size:1.06rem}
.val{display:grid;gap:8px}
.val .btn{text-align:left}
.tarning{font-family:var(--pix);font-weight:800;font-size:1.6rem;color:var(--gold);text-align:center;padding:6px}
.tarning.d{color:var(--gold);text-shadow:0 0 12px var(--gold)} .tarning.dm{color:var(--red)}
.ordning{display:flex;gap:4px;flex-wrap:wrap;font-size:.75rem}
.ordning span{padding:2px 6px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
.ordning span.nu{background:var(--gold);color:#2a1c05;border-color:var(--gold)}
.ordning span.f{border-color:#7a2219}
.ordning span.gjord{opacity:.4}
/* Modal */
.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:10px}
.modal .inner{background:var(--panel);border:1px solid var(--line);border-radius:8px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
@media(min-width:700px){.modal{align-items:center}}
table.stat{width:100%;border-collapse:collapse;font-size:.92rem}
table.stat td{padding:3px 6px;border-bottom:1px solid #4a3c2c55}
table.stat td:last-child{text-align:right;font-family:var(--pix);font-weight:800;color:var(--gold)}
.eg{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;text-align:center}
.eg div{background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:6px 2px}
.eg b{display:block;font-family:var(--pix);font-weight:800;font-size:1.25rem;color:var(--gold)}
.eg span{font-size:.72rem;color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
input[type=text],input[type=password],select{font:inherit;background:var(--bg2);color:var(--fg);border:1px solid var(--line);border-radius:4px;padding:9px}
.quest{border-left:4px solid var(--gold)}
/* Rad i basaren: text till vänster, knappen alltid längst till höger på samma rad */
.vara{display:flex;gap:12px;align-items:center;justify-content:space-between}
.vara>span{flex:1;min-width:0}
.vara>.btn{flex:none}
.platsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.platskort{display:flex;flex-direction:column;gap:0;padding:0;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.platskort:disabled{opacity:.5;cursor:not-allowed}
.platskort canvas{width:100%;aspect-ratio:3/1;object-fit:cover;object-position:center 70%;display:block;border-bottom:1px solid var(--line)}
.platskort .pk{display:flex;flex-direction:column;gap:4px;padding:10px 12px 12px}
.platskort .tag{align-self:flex-start;margin-top:4px}
.saljare{width:48px;height:48px;flex:none;border-radius:4px;background:#2b2219;border:1px solid var(--line)}
.spelledare{display:flex;gap:10px;align-items:center;margin-bottom:8px}.spelledare h2{margin:0}
/* Striden: händelserutan direkt under TV:n */
.stridpanel{border-color:var(--gold);box-shadow:0 0 0 1px #e0b45033}
.resultat{display:flex;flex-direction:column;gap:10px}
.resultat .rubrik{display:flex;align-items:center;gap:10px}
.resultat .rubrik canvas{width:44px;height:44px;border-radius:4px;border:1px solid var(--line);background:#2b2219;flex:none}
.resultat .rubrik h3{font-size:1.15rem;color:var(--gold)}
.resultat .rader{display:flex;flex-direction:column;gap:6px}
.resultat .rader p{font-size:1.05rem;line-height:1.4;padding:6px 10px;border-radius:5px;background:#0d0b08;border-left:4px solid var(--line)}
.resultat .rader p.ok{border-left-color:var(--moss)} .resultat .rader p.fel{border-left-color:var(--red)}
.resultat .rader p.d{border-left-color:var(--gold);color:var(--gold)} .resultat .rader p.dm{border-left-color:#ff4b3e;color:#ff9d92}
.resultat .rader p.info{color:var(--muted)}
.t20{display:inline-block;font-family:var(--pix);font-weight:800;background:var(--gold);color:#2a1c05;border-radius:4px;padding:0 6px;margin:0 2px}
.utfall{font-family:var(--pix);letter-spacing:.03em}
.agerar{font-family:var(--pix);font-weight:800;font-size:1.1rem;color:var(--gold);text-align:center;margin:6px 0}
/* Tärningsrutan */
#tarning{position:fixed;inset:0;z-index:30;background:#120e0aee;display:flex;align-items:center;justify-content:center;padding:16px}
#tarning[hidden]{display:none}
.tr-kort{background:var(--panel);border:2px solid var(--gold);border-radius:10px;padding:22px 18px;max-width:420px;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.tr-vem{font-family:var(--pix);font-weight:800;color:var(--muted);font-size:1rem}
.tr-kort h2{font-size:1.5rem;margin-top:-6px}
.tr-mal{font-size:1.1rem} .tr-mal b{font-family:var(--pix);color:var(--gold);font-size:1.3rem}
.tr-tarningar{display:flex;gap:18px;justify-content:center;margin:8px 0}
.d20{width:104px;height:104px;background:var(--gold);clip-path:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);display:grid;place-items:center;transition:transform .2s,background .2s,opacity .2s}
.d20 span{font-family:var(--pix);font-weight:800;font-size:2.6rem;color:#2a1c05}
.d20.rullar{animation:rull .18s linear infinite}
@keyframes rull{0%{transform:rotate(0) scale(.95)}50%{transform:rotate(12deg) scale(1.05)}100%{transform:rotate(0) scale(.95)}}
.d20.ok{background:var(--moss)} .d20.miss{background:#a8a090} .d20.drake{background:#ffd23f;transform:scale(1.12)} .d20.demon{background:var(--red)} .d20.bort{opacity:.3}
.d20.demon span{color:#fff}
.tr-utfall{font-family:var(--pix);font-weight:800;font-size:1.5rem;min-height:1.6em}
.tr-utfall.ok{color:var(--moss)} .tr-utfall.miss{color:#c9bfae} .tr-utfall.drake{color:#ffd23f} .tr-utfall.demon{color:#ff6a5e}
.tr-kort .btn{width:100%;font-size:1.15rem;padding:14px}
/* Ikoner för saker */
canvas.px.ikon{display:inline-block;width:24px;height:24px;vertical-align:middle;margin-right:5px;flex:none;image-rendering:pixelated}
table.stat td.notis{font-family:inherit;font-weight:400;color:var(--muted);text-align:left}
.kassa canvas.px.ikon{width:26px;height:26px;margin-right:4px;vertical-align:-5px}
.packning{display:flex;flex-wrap:wrap;align-items:center;gap:2px 0}
.sakchip{display:inline-flex;align-items:center;margin:2px 10px 2px 0;color:var(--fg)}
.foremal{display:flex;align-items:center;gap:6px;background:var(--bg2);border:1px solid var(--line);border-radius:5px;padding:6px 10px}
.foremal canvas.px.ikon{width:32px;height:32px}
.figurval{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.figurval .fv{padding:0;border:2px solid var(--line);border-radius:4px;background:#2b2219;aspect-ratio:1}
.figurval .fv.vald{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}
.figurval canvas{width:100%;height:100%;display:block}
.citat{font-style:italic;color:var(--gold)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:480px){.slots{gap:5px}.eg b{font-size:1.05rem}}
/* I mobilläget ligger hemmets tre stora knappar på varsin rad och är lika breda. */
@media(max-width:600px){.hemval{flex-direction:column;align-items:stretch}.hemval .btn{width:100%}}

/* Lansors anslagstavla: uppdragen som riktiga lappar uppsatta på en korktavla */
.anslag{display:flex;flex-direction:column;gap:22px;padding:22px 14px 26px;border-radius:6px;border:8px solid #5a3b1f;
  box-shadow:inset 0 0 0 2px #2e1d0e, inset 0 6px 14px #0007, 0 3px 0 #2e1d0e;
  background:#9a6b3f radial-gradient(#7d5430 1px, transparent 1.6px) 0 0/9px 9px, radial-gradient(#b4844f 1px, transparent 1.4px) 4px 5px/11px 11px;
  background-color:#9a6b3f}
.lappram{filter:drop-shadow(0 5px 6px #000a);transform:rotate(-1.2deg);position:relative}
.lappram:nth-child(2n){transform:rotate(.9deg)}
.lappram:nth-child(3n){transform:rotate(-.4deg)}
.lappram::before{content:"";position:absolute;z-index:2;left:50%;top:-7px;width:16px;height:16px;margin-left:-8px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #ff8a7a, #c62f22 55%, #6d140c);box-shadow:0 3px 3px #0008}
.lappram:nth-child(2n)::before{background:radial-gradient(circle at 35% 35%, #9ad0ff, #2f6fc6 55%, #12335e)}
.lappram:nth-child(3n)::before{background:radial-gradient(circle at 35% 35%, #fff09a, #c9a22f 55%, #6b520f)}
.card.lapp{border:0;border-radius:2px;padding:20px 16px 22px;color:#3a2a16;
  background:#ecdcb0 radial-gradient(ellipse at 85% 15%, #d8bf86 0, transparent 45%), radial-gradient(ellipse at 10% 90%, #dcc58f 0, transparent 40%);
  background-color:#ecdcb0;
